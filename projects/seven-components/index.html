<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e7eaf3"><title>七个组件 · Seven Components</title>
<style>
:root{color-scheme:light dark;--bg:#e7eaf3;--panel:#f7f8fd;--ink:#161b36;--mut:#646b8c;--line:#d0d5e6;--a:#3b34c8;--b:#b23a9c;--c:#f59a7b;--grad:linear-gradient(115deg,var(--a),var(--b) 58%,var(--c));--shadow:0 24px 50px -35px #161b3660}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0b0e21;--panel:#151933;--ink:#eceffb;--mut:#9ba1c2;--line:#2a2f54;--a:#8c84ff;--b:#e873cc;--c:#ffb596;--shadow:0 24px 50px -30px #000}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0b0e21;--panel:#151933;--ink:#eceffb;--mut:#9ba1c2;--line:#2a2f54;--a:#8c84ff;--b:#e873cc;--c:#ffb596}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:auto;padding:18px 18px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 16px}.top strong{font-size:13px;letter-spacing:.14em}.theme{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:7px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.tile{grid-column:span 2;background:var(--panel);border:1px solid var(--line);border-radius:23px;padding:18px;min-height:260px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}.tile.wide{grid-column:span 3}.head{display:flex;justify-content:space-between;gap:10px}.head h2{font-size:14px;margin:0;font-weight:650}.head p{font-size:11px;color:var(--mut);margin:3px 0 0}.stage{flex:1;display:grid;place-items:center;min-height:150px}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--b);outline-offset:4px}
.big{font-size:30px;font-weight:650;font-variant-numeric:tabular-nums}
.hold{position:relative;width:min(220px,100%);height:58px;border:0;border-radius:30px;background:var(--bg);box-shadow:inset 0 2px 5px #0002;overflow:hidden;touch-action:none;user-select:none}.hold:before{content:"";position:absolute;inset:0;background:var(--grad);transform:scaleX(var(--p,0));transform-origin:left}.hold span{position:relative;font-weight:650;letter-spacing:.08em}.hold.done{animation:pop .35s}@keyframes pop{50%{transform:scale(1.06)}}
.switches{width:100%;max-width:240px}.swrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0}.sw{position:relative;width:82px;height:42px;border:0;border-radius:24px;background:var(--bg);box-shadow:inset 0 2px 5px #0002;cursor:pointer}.sw:before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--grad);opacity:0;transition:.3s}.sw[aria-checked=true]:before{opacity:1}.thumb{position:absolute;left:4px;top:4px;width:34px;height:34px;border-radius:50%;background:white;box-shadow:0 3px 8px #0003;transition:left .35s cubic-bezier(.2,1.4,.4,1)}.sw[aria-checked=true] .thumb{left:44px}
.todo{width:100%;max-width:330px}.task{position:relative;display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px dashed var(--line);cursor:pointer}.task:last-child{border:0}.task input{accent-color:var(--b);width:18px;height:18px}.task input:checked+span{text-decoration:line-through;color:var(--mut)}.stamp{margin-left:auto;color:#c8281e;border:2px solid #c8281e;border-radius:7px;padding:1px 5px;font-size:12px;font-weight:800;opacity:0;transform:rotate(-9deg) scale(1.6);transition:.25s}.task input:checked~.stamp{opacity:.9;transform:rotate(-9deg) scale(1)}
.string{width:100%;max-width:420px;touch-action:none;cursor:grab}.string:active{cursor:grabbing}
.knob{width:190px;height:190px;border-radius:50%;position:relative;touch-action:none;cursor:grab;background:repeating-conic-gradient(#b8bfd8 0 1deg,transparent 1deg 7deg);mask:radial-gradient(circle,transparent 67%,#000 68%);-webkit-mask:radial-gradient(circle,transparent 67%,#000 68%)}.knob:after{content:"";position:absolute;inset:29px;border-radius:50%;background:conic-gradient(var(--panel),var(--bg),var(--panel));box-shadow:0 15px 25px #0003;mask:none;-webkit-mask:none}.knob i{position:absolute;z-index:2;left:calc(50% - 3px);top:34px;width:6px;height:19px;border-radius:5px;background:var(--grad);transform-origin:3px 61px}.knob b{position:absolute;z-index:3;inset:61px;border-radius:50%;display:grid;place-items:center;background:var(--panel);font-size:26px;box-shadow:inset 0 -4px 8px #0002}
.odo{display:flex;gap:5px;background:#10142f;color:#fff;padding:9px 13px;border-radius:14px;font-size:56px;font-weight:650;font-variant-numeric:tabular-nums;box-shadow:inset 0 3px 9px #000}.odo span{width:.62em;text-align:center}.actions{display:flex;gap:14px}.round{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:var(--panel);font-size:24px;cursor:pointer;box-shadow:var(--shadow)}.round.primary{background:var(--grad);color:white;border:0}
.jar{width:112px;height:160px;border:3px solid var(--ink);border-top:0;border-radius:8px 8px 23px 23px;position:relative;overflow:hidden;background:#ffffff18}.jar:before{content:"";position:absolute;left:22px;right:22px;top:-10px;height:12px;border:3px solid var(--ink);border-radius:5px}.liquid{position:absolute;bottom:0;left:0;right:0;height:62%;background:linear-gradient(var(--c),var(--b),var(--a));transition:height .25s;border-radius:45% 45% 0 0}.jarval{font-size:28px;font-weight:700}.jarrow{display:flex;gap:8px;align-items:center}.pill{border:1px solid var(--line);border-radius:12px;padding:7px 12px;background:var(--bg);cursor:pointer}
@media(max-width:760px){.tile,.tile.wide{grid-column:1/-1;min-height:230px}.wrap{padding:12px}.grid{gap:10px}.tile{padding:16px}.top{margin-bottom:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><main class="wrap">
<header class="top"><strong>INTERACTION STUDIES / 07</strong><button class="theme" id="theme">切换明暗</button></header>
<div class="grid">
<section class="tile"><div class="head"><div><h2>长按确认</h2><p>按住 0.9 秒，松手会回弹</p></div></div><div class="stage"><button class="hold" id="hold"><span>按住以删除</span></button></div></section>
<section class="tile"><div class="head"><div><h2>弹性开关</h2><p>拨动时滑块带有弹性</p></div></div><div class="stage"><div class="switches"><div class="swrow">勿扰模式<button class="sw" role="switch" aria-checked="true"><i class="thumb"></i></button></div><div class="swrow">夜间护眼<button class="sw" role="switch" aria-checked="false"><i class="thumb"></i></button></div></div></div></section>
<section class="tile"><div class="head"><div><h2>盖章确认</h2><p>每勾选一项就盖一枚印</p></div></div><div class="stage"><div class="todo"><label class="task"><input type="checkbox"><span>回复三封邮件</span><b class="stamp">済</b></label><label class="task"><input type="checkbox" checked><span>把标本归档</span><b class="stamp">済</b></label><label class="task"><input type="checkbox"><span>给彗星拍张照</span><b class="stamp">済</b></label></div></div></section>
<section class="tile wide"><div class="head"><div><h2>琴弦滑块</h2><p>拖动拨弦，松手后琴弦振动</p></div><b class="big" id="sv">40</b></div><div class="stage"><svg class="string" id="string" viewBox="0 0 320 100"><path d="M20 50H300" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/><path id="wave" d="M20 50H300" stroke="url(#sg)" stroke-width="4" fill="none" stroke-linecap="round"/><defs><linearGradient id="sg"><stop stop-color="var(--a)"/><stop offset=".6" stop-color="var(--b)"/><stop offset="1" stop-color="var(--c)"/></linearGradient></defs><circle id="dot" cx="132" cy="50" r="10" fill="var(--panel)" stroke="var(--b)" stroke-width="3"/></svg></div></section>
<section class="tile wide"><div class="head"><div><h2>旋钮</h2><p>绕圈拖动，也可以用方向键</p></div></div><div class="stage"><div class="knob" id="knob" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40"><i id="needle"></i><b id="kv">40</b></div></div></section>
<section class="tile wide"><div class="head"><div><h2>里程表步进器</h2><p>按住加号或减号，数字会越转越快</p></div></div><div class="stage"><div style="display:grid;justify-items:center;gap:18px"><div class="odo" id="odo">128</div><div class="actions"><button class="round" id="minus">−</button><button class="round primary" id="plus">+</button></div></div></div></section>
<section class="tile wide"><div class="head"><div><h2>标本瓶进度</h2><p>上下拖动瓶身，液面会晃动</p></div></div><div class="stage"><div class="jarrow"><div class="jar" id="jar" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62"><div class="liquid" id="liquid"></div></div><div style="display:grid;gap:12px"><div class="jarval"><span id="jv">62</span>%</div><div><button class="pill" id="jm">−10</button> <button class="pill" id="jp">+10</button></div></div></div></div></section>
</div></main>
<script>
const $=s=>document.querySelector(s),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':r.dataset.theme==='light'?'dark':matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark'};
(()=>{const b=$('#hold'),label=$('span',b);let down=false,p=0,raf=0,last=0,done=false;function tick(t){p=clamp(p+(down?1:-3.75)*(t-last)/900,0,1);last=t;b.style.setProperty('--p',p);if(p>=1){done=true;down=false;b.classList.add('done');label.textContent='✓ 已确认';setTimeout(()=>{done=false;p=0;b.classList.remove('done');label.textContent='按住以删除';},1400)}if(!done&&(down||p>0))raf=requestAnimationFrame(tick);else raf=0}const start=e=>{e.preventDefault();if(done)return;down=true;last=performance.now();if(!raf)raf=requestAnimationFrame(tick)};b.onpointerdown=start;['pointerup','pointercancel','lostpointercapture'].forEach(k=>b.addEventListener(k,()=>down=false));b.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)start(e)};})();
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on)});
document.querySelectorAll('.task input').forEach(i=>i.addEventListener('change',()=>{const s=i.parentElement.querySelector('.stamp');s.animate([{transform:'scale(2) rotate(-18deg)',opacity:0},{transform:'scale(1) rotate(-9deg)',opacity:1}],{duration:300,fill:'forwards'})}));
(()=>{const svg=$('#string'),path=$('#wave'),dot=$('#dot'),v=$('#sv');let x=132,amp=0,phase=0,drag=false;function draw(){let d='';for(let i=0;i<=70;i++){const xx=20+i*4,yy=50+amp*Math.sin((xx-x)*.035)*Math.exp(-Math.abs(xx-x)*.008)*Math.sin(phase);d+=(i?'L':'M')+xx+' '+yy}path.setAttribute('d',d);dot.setAttribute('cx',x);dot.setAttribute('cy',50);if(!drag){amp*=.975;phase+=.22;if(amp<.1)amp=0}requestAnimationFrame(draw)}const move=e=>{const r=svg.getBoundingClientRect();x=clamp((e.clientX-r.left)/r.width*320,20,300);v.textContent=Math.round((x-20)/2.8);if(drag)amp=18};svg.onpointerdown=e=>{drag=true;svg.setPointerCapture(e.pointerId);move(e)};svg.onpointermove=e=>{if(drag)move(e)};svg.onpointerup=svg.onpointercancel=()=>{drag=false;amp=24};svg.onkeydown=e=>{if(e.key.startsWith('Arrow')){x=clamp(x+(e.key==='ArrowRight'||e.key==='ArrowUp'?5:-5),20,300);v.textContent=Math.round((x-20)/2.8);amp=20}};draw()})();
(()=>{const k=$('#knob'),n=$('#needle'),v=$('#kv');let value=40,drag=false,last=0;function set(x){value=clamp(x,0,100);v.textContent=Math.round(value);n.style.transform='rotate('+(-135+value*2.7)+'deg)';k.setAttribute('aria-valuenow',Math.round(value))}const angle=e=>{const r=k.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI};k.onpointerdown=e=>{drag=true;k.setPointerCapture(e.pointerId);last=angle(e)};k.onpointermove=e=>{if(!drag)return;let a=angle(e),d=a-last;if(d>180)d-=360;if(d< -180)d+=360;last=a;set(value+d/2.7)};k.onpointerup=k.onpointercancel=()=>drag=false;k.onkeydown=e=>{const d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1,PageUp:10,PageDown:-10}[e.key];if(d){e.preventDefault();set(value+d)}};set(40)})();
(()=>{let v=128;const out=$('#odo');function set(d){v=clamp(v+d,0,999);out.textContent=String(v).padStart(3,'0')}function bind(b,d){let timer,delay;const stop=()=>clearTimeout(timer);b.onpointerdown=e=>{e.preventDefault();set(d);let n=0,ms=300;const tick=()=>{n++;set(d*(n>18?5:1));ms=Math.max(45,ms*.88);timer=setTimeout(tick,ms)};timer=setTimeout(tick,420)};['pointerup','pointerleave','pointercancel','blur'].forEach(x=>b.addEventListener(x,stop));b.onclick=e=>{if(e.detail===0)set(d)}}bind($('#minus'),-1);bind($('#plus'),1)})();
(()=>{const jar=$('#jar'),liquid=$('#liquid'),out=$('#jv');let v=62,drag=false;function set(n){v=clamp(n,0,100);liquid.style.height=v+'%';out.textContent=Math.round(v);jar.setAttribute('aria-valuenow',Math.round(v))}const move=e=>{const r=jar.getBoundingClientRect();set((r.bottom-e.clientY)/r.height*100)};jar.onpointerdown=e=>{drag=true;jar.setPointerCapture(e.pointerId);move(e)};jar.onpointermove=e=>{if(drag)move(e)};jar.onpointerup=jar.onpointercancel=()=>drag=false;jar.onkeydown=e=>{const d={ArrowUp:5,ArrowRight:5,ArrowDown:-5,ArrowLeft:-5}[e.key];if(d){e.preventDefault();set(v+d)}};$('#jm').onclick=()=>set(v-10);$('#jp').onclick=()=>set(v+10);set(62)})();
</script></body></html>
