<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="八个组件：八件可以上手的交互控件——压印、拨钮、钤印、弦、旋钮、计数轮、浸瓶与三维键帽。">
<meta name="theme-color" content="#e8e6df">
<title>八个组件 · Eight Components</title>
<link rel="stylesheet" href="./styles/sheet.css?v=3.0.0">
<link rel="stylesheet" href="./styles/controls.css?v=3.0.0">
</head>
<body>

<div class="sheet">

  <header class="masthead">
    <div class="masthead-title">
      <p class="eyebrow">宫水.com · INTERACTION STUDY</p>
      <h1>八个组件<em>EIGHT TACTILE COMPONENTS</em></h1>
      <p class="lede">八件可以上手把玩的小控件。同一套圆角、同一条弹性曲线，每一件只负责把一个动作做得有手感：按住、拨动、勾选、拨弦、旋转、计数、注液、按键。</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="切换明暗主题">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.6A8.6 8.6 0 0 1 9.4 3.6a8.6 8.6 0 1 0 11 11Z"/></svg>
      <span id="theme-label">LIGHT</span>
    </button>
  </header>

  <main class="plates">

    <!-- 01 压印 -->
    <figure class="plate" id="p-hold" data-tone="orange">
      <figcaption class="plate-head"><span class="plate-index">01</span><h2>压印<small>HOLD</small></h2></figcaption>
      <div class="plate-stage">
        <button class="hold" id="hold" type="button" aria-label="按住 0.9 秒确认">
          <svg class="hold-ring" viewBox="0 0 140 140" aria-hidden="true" focusable="false">
            <circle class="hold-track" cx="70" cy="70" r="62"/>
            <circle class="hold-prog" cx="70" cy="70" r="62" pathLength="100"/>
          </svg>
          <span class="hold-core" aria-hidden="true">
            <span class="hold-label">按住</span>
            <svg class="hold-check" viewBox="0 0 24 24" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </span>
        </button>
      </div>
      <p class="plate-hint">按住 0.9 秒确认 · 中途松手会退回</p>
    </figure>

    <!-- 02 拨钮 -->
    <figure class="plate" id="p-toggle" data-tone="green">
      <figcaption class="plate-head"><span class="plate-index">02</span><h2>拨钮<small>SWITCH</small></h2></figcaption>
      <div class="plate-stage">
        <div class="switch-list">
          <div class="switch-row"><span class="switch-name">勿扰模式</span><button class="switch" type="button" role="switch" aria-checked="true" aria-label="勿扰模式" data-switch><span class="switch-thumb"></span></button></div>
          <div class="switch-row"><span class="switch-name">夜间护眼</span><button class="switch" type="button" role="switch" aria-checked="false" aria-label="夜间护眼" data-switch><span class="switch-thumb"></span></button></div>
          <div class="switch-row"><span class="switch-name">触感反馈</span><button class="switch" type="button" role="switch" aria-checked="true" aria-label="触感反馈" data-switch><span class="switch-thumb"></span></button></div>
        </div>
      </div>
      <p class="plate-hint">点击，或者拖着拨过去 · 回弹有弹性</p>
    </figure>

    <!-- 03 钤印 -->
    <figure class="plate" id="p-stamp" data-tone="blue">
      <figcaption class="plate-head"><span class="plate-index">03</span><h2>钤印<small>CHECK</small></h2></figcaption>
      <div class="plate-stage">
        <div class="tasks">
          <label class="task"><input type="checkbox"><span class="task-box" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="task-text">回复三封邮件</span></label>
          <label class="task"><input type="checkbox" checked><span class="task-box" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="task-text">把标本归档</span></label>
          <label class="task"><input type="checkbox"><span class="task-box" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="task-text">给彗星拍张照</span></label>
        </div>
      </div>
      <p class="plate-hint">逐行勾选 · 落印、画线、涟漪一起发生</p>
    </figure>

    <!-- 04 弦 -->
    <figure class="plate" id="p-string" data-tone="pink">
      <figcaption class="plate-head"><span class="plate-index">04</span><h2>弦<small>STRING</small></h2></figcaption>
      <div class="plate-stage">
        <div class="string-wrap">
          <div class="readout"><span id="string-value">40</span><small>N</small></div>
          <svg class="string" id="string" viewBox="0 0 320 120" tabindex="0" role="slider" aria-label="张力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
            <g id="string-ticks"></g>
            <circle class="string-post" cx="16" cy="60" r="5"/>
            <circle class="string-post" cx="304" cy="60" r="5"/>
            <path class="string-ghost" id="string-ghost" d="M16 60L170 60L304 60"/>
            <path class="string-line" id="string-line" d="M16 60L170 60L304 60"/>
            <circle class="string-bead" id="string-bead" cx="170" cy="60" r="11"/>
          </svg>
        </div>
      </div>
      <p class="plate-hint">左右拖动改变张力 · 上下拉开再松手，弦会振起来</p>
    </figure>

    <!-- 05 旋钮 -->
    <figure class="plate" id="p-knob" data-tone="violet">
      <figcaption class="plate-head"><span class="plate-index">05</span><h2>旋钮<small>KNOB</small></h2></figcaption>
      <div class="plate-stage">
        <div class="knob" id="knob" role="slider" tabindex="0" aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
          <svg class="knob-ticks" viewBox="0 0 200 200" aria-hidden="true" focusable="false"><g id="knob-ticks"></g></svg>
          <div class="knob-cap" id="knob-cap" aria-hidden="true"><i class="knob-mark"></i></div>
          <div class="knob-value" aria-hidden="true"><span><b id="knob-value">40</b><small>%</small></span></div>
        </div>
      </div>
      <p class="plate-hint">绕圈拖动 · 方向键微调 · Shift 加大步长</p>
    </figure>

    <!-- 06 计数轮 -->
    <figure class="plate" id="p-counter" data-tone="amber">
      <figcaption class="plate-head"><span class="plate-index">06</span><h2>计数轮<small>COUNTER</small></h2></figcaption>
      <div class="plate-stage">
        <div class="counter">
          <div class="counter-window" id="counter-window" role="img" aria-label="计数 128">
            <div class="wheel" data-wheel="2"><div class="strip"></div></div>
            <div class="wheel" data-wheel="1"><div class="strip"></div></div>
            <div class="wheel" data-wheel="0"><div class="strip"></div></div>
          </div>
          <div class="counter-buttons">
            <button class="counter-btn" id="count-down" type="button" aria-label="减少">−</button>
            <button class="counter-btn is-plus" id="count-up" type="button" aria-label="增加">+</button>
          </div>
        </div>
      </div>
      <p class="plate-hint">三只机械数字轮，逢九进位 · 按住加减越转越快</p>
    </figure>

    <!-- 07 浸瓶 -->
    <figure class="plate" id="p-jar" data-tone="cyan">
      <figcaption class="plate-head"><span class="plate-index">07</span><h2>浸瓶<small>JAR</small></h2></figcaption>
      <div class="plate-stage">
        <div class="jar-wrap">
          <svg class="jar" id="jar" viewBox="0 0 110 150" tabindex="0" role="slider" aria-label="液位" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62">
            <defs>
              <clipPath id="jar-clip"><path d="M20 8H80a8 8 0 0 1 8 8V118a22 22 0 0 1-22 22H34a22 22 0 0 1-22-22V16a8 8 0 0 1 8-8Z"/></clipPath>
              <linearGradient id="jar-grad" x1="0" y1="0" x2="0" y2="1"><stop class="jar-stop-a" offset="0"/><stop class="jar-stop-b" offset="1"/></linearGradient>
            </defs>
            <path class="jar-glass" d="M20 8H80a8 8 0 0 1 8 8V118a22 22 0 0 1-22 22H34a22 22 0 0 1-22-22V16a8 8 0 0 1 8-8Z"/>
            <g clip-path="url(#jar-clip)">
              <path class="jar-liquid-back" id="jar-liquid-back" d=""/>
              <path class="jar-liquid" id="jar-liquid" d=""/>
              <g id="jar-bubbles"></g>
            </g>
            <path class="jar-shine" d="M24 30V92"/>
            <path class="jar-rim" d="M20 8H80a8 8 0 0 1 8 8V118a22 22 0 0 1-22 22H34a22 22 0 0 1-22-22V16a8 8 0 0 1 8-8Z"/>
            <path class="jar-tick" d="M94 140h8M94 108.5h5M94 77h8M94 45.5h5M94 14h8"/>
          </svg>
          <div class="jar-side">
            <div class="readout"><span id="jar-readout">62</span><small>%</small></div>
            <div class="jar-buttons">
              <button class="mini-btn" id="jar-up" type="button" aria-label="液位升高 10">+10</button>
              <button class="mini-btn" id="jar-down" type="button" aria-label="液位降低 10">−10</button>
            </div>
          </div>
        </div>
      </div>
      <p class="plate-hint">上下拖动瓶身改变液面 · 液体会晃，气泡一直往上冒</p>
    </figure>

    <!-- 08 键帽 -->
    <figure class="plate" id="p-key" data-tone="red">
      <figcaption class="plate-head"><span class="plate-index">08</span><h2>键帽<small>KEY</small></h2></figcaption>
      <div class="plate-stage">
        <div class="key-stage" id="key-stage">
          <div class="key-scene" id="key-scene">
            <div class="key-base"></div>
            <div class="key" id="key-cap">
              <i class="key-side s-front"></i><i class="key-side s-back"></i><i class="key-side s-left"></i><i class="key-side s-right"></i>
              <span class="key-top"><b>按</b></span>
            </div>
          </div>
          <button class="key-hit" id="key-hit" type="button" aria-label="实体按键，按下"></button>
        </div>
        <div class="key-count"><b id="key-count">0</b><small>次</small></div>
      </div>
      <p class="plate-hint">真三维 · 移动指针带动倾角，按下整块下沉</p>
    </figure>

  </main>

  <footer class="colophon">
    <span>宫水.com · GONGSHUI · 八个组件</span>
    <span>全键盘可操作 · 尊重系统的「减少动态效果」</span>
  </footer>
</div>

<noscript>
  <p style="max-width:640px;margin:0 auto;padding:0 26px 40px;color:#5f6154;font:13px/1.7 system-ui,sans-serif">
    这八件组件都需要 JavaScript 才能交互。页面文字仍然可读。
  </p>
</noscript>

<script src="./scripts/core.js?v=3.0.0"></script>
<script src="./scripts/controls.js?v=3.0.0"></script>
<script src="./scripts/press-key.js?v=3.0.0"></script>
</body>
</html>
