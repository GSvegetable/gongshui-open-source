name: Independent project quality

on:
  pull_request:
    paths:
      - "projects/contributors-globe/**"
      - "projects/bookmark-hall/**"
      - "projects/navigation-interaction/**"
      - ".github/workflows/independent-projects-quality.yml"
  push:
    branches: [main]
    paths:
      - "projects/contributors-globe/**"
      - "projects/bookmark-hall/**"
      - "projects/navigation-interaction/**"
      - ".github/workflows/independent-projects-quality.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check projects/contributors-globe/embed.js
          node --check projects/bookmark-hall/embed.js
          node --check projects/navigation-interaction/embed.js
          node --check projects/contributors-globe/scripts/globe.js
          node --check projects/bookmark-hall/scripts/bookmarks-corridor.js
          node --check projects/navigation-interaction/scripts/navigation.js
      - name: Check project boundaries and required assets
        run: |
          ! grep -Eq 'AppState|localStorage|preview-card|siteI18n|siteCorridor|is-bookmarks|mario-nav|navEl' projects/bookmark-hall/scripts/bookmarks-corridor.js
          ! grep -Eq 'siteI18n|siteGlobe|preview-card|nav-home' projects/contributors-globe/scripts/globe.js
          ! grep -Eq 'mario-nav|portfolio-live|portfolio-embed|top-bar' projects/navigation-interaction/styles/navigation.css
          ! test -e projects/navigation-interaction/styles/portfolio-works.css
          grep -q 'gongshui:bookmark-hall:data' projects/bookmark-hall/scripts/bookmarks-corridor.js
          grep -q 'globe.gl@2.46.2' projects/contributors-globe/scripts/globe.js
          test -s projects/contributors-globe/embed.js
          test -s projects/bookmark-hall/embed.js
          test -s projects/navigation-interaction/embed.js
          test -s projects/contributors-globe/index.html
          test -s projects/contributors-globe/data/contributors.json
          test -s projects/contributors-globe/data/ne_110m_admin_0_countries.geojson
          test -s projects/contributors-globe/assets/earth/earth-blue-marble.jpg
          test -s projects/contributors-globe/assets/earth/earth-night.jpg
          test -s projects/contributors-globe/assets/earth/earth-topology.png
          test -s projects/contributors-globe/assets/earth/night-sky.jpg
          test -s projects/bookmark-hall/index.html
          test -s projects/navigation-interaction/index.html
          grep -q 'gongshui:embed:ready' projects/contributors-globe/embed.js
          grep -q 'gongshui:embed:ready' projects/bookmark-hall/embed.js
          grep -q 'gongshui:embed:ready' projects/navigation-interaction/embed.js
          grep -q 'setLanguage' projects/contributors-globe/embed.js
          grep -q 'setLanguage' projects/bookmark-hall/embed.js
          grep -q 'setLanguage' projects/navigation-interaction/embed.js
          grep -q 'const ready = new Promise' projects/contributors-globe/embed.js
          grep -q 'const ready = new Promise' projects/bookmark-hall/embed.js
          grep -q 'const ready = new Promise' projects/navigation-interaction/embed.js
          grep -q "get('pins') !== '0'" projects/contributors-globe/scripts/globe.js
          grep -q "get('controls') === '0'" projects/bookmark-hall/scripts/bookmarks-corridor.js
          grep -q 'MAX_ITEMS' projects/bookmark-hall/scripts/bookmarks-corridor.js
          grep -q "params.get('samples')" projects/navigation-interaction/scripts/navigation.js
          grep -q 'is-filtered' projects/navigation-interaction/scripts/navigation.js
          grep -q 'is-single-sample' projects/navigation-interaction/styles/navigation.css
          grep -q 'gongshui:bookmark-hall:control' projects/bookmark-hall/embed.js
          grep -q 'gongshui:navigation-interaction:reset' projects/navigation-interaction/embed.js
          grep -q 'data-sample' projects/navigation-interaction/README.md
          grep -q 'data-pins' projects/contributors-globe/README.md
          grep -q 'setItems' projects/bookmark-hall/README.md
          test -s projects/contributors-globe/LICENSE
          test -s projects/bookmark-hall/LICENSE
          test -s projects/navigation-interaction/LICENSE
          grep -q 'gongshui:embed:language' projects/contributors-globe/scripts/globe.js
          grep -q 'gongshui:embed:language' projects/bookmark-hall/scripts/bookmarks-corridor.js
          grep -q 'gongshui:embed:language' projects/navigation-interaction/scripts/navigation.js
          ! grep -q "postMessage(.*'\*'" projects/bookmark-hall/scripts/bookmarks-corridor.js
      - name: Check navigation specimen count
        run: |
          count=$(grep -o 'data-nav-sample=' projects/navigation-interaction/index.html | wc -l)
          test "$count" -eq 24
