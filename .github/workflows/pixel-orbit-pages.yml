name: Deploy Pixel Orbit to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/pixel-orbit/**"
      - ".github/workflows/pixel-orbit-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pixel Orbit site
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/pixel-orbit
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
