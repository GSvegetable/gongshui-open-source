name: Deploy consolidated project site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/pixel-orbit/**"
      - "projects/pixel-daylight-switch/**"
      - ".github/workflows/pixel-orbit-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble both project sites
        run: |
          rm -rf _site
          mkdir -p _site/pixel-daylight-switch
          cp -a projects/pixel-orbit/. _site/
          cp -a projects/pixel-daylight-switch/. _site/pixel-daylight-switch/
          touch _site/.nojekyll

      - name: Upload consolidated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
