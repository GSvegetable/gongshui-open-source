name: Deploy consolidated project site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/pixel-orbit/**"
      - "projects/pixel-daylight-switch/**"
      - "projects/contributors-globe/**"
      - "projects/bookmark-hall/**"
      - "projects/navigation-interaction/**"
      - "projects/3-sy/**"
      - "projects/seven-components/**"
      - ".github/workflows/deploy-project-sites.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v4

      - name: Set up Node for the 3_sy build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/3-sy/package-lock.json

      - name: Build 3_sy
        working-directory: projects/3-sy
        run: |
          npm ci
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble all project sites
        run: |
          rm -rf _site
          mkdir -p _site/pixel-daylight-switch _site/contributors-globe _site/bookmark-hall _site/navigation-interaction _site/3-sy _site/seven-components
          cp -a projects/pixel-orbit/. _site/
          cp -a projects/pixel-daylight-switch/. _site/pixel-daylight-switch/
          cp -a projects/contributors-globe/. _site/contributors-globe/
          cp -a projects/bookmark-hall/. _site/bookmark-hall/
          cp -a projects/navigation-interaction/. _site/navigation-interaction/
          cp -a projects/3-sy/dist/. _site/3-sy/
          cp -a projects/seven-components/. _site/seven-components/
          touch _site/.nojekyll

      - name: Verify standalone entry points
        run: |
          test -s _site/contributors-globe/index.html
          test -s _site/bookmark-hall/index.html
          test -s _site/navigation-interaction/index.html
          test -s _site/seven-components/index.html
          test -s _site/contributors-globe/data/contributors.json
          test -s _site/contributors-globe/data/ne_110m_admin_0_countries.geojson
          test -s _site/contributors-globe/assets/earth/earth-blue-marble.jpg
          test -s _site/contributors-globe/assets/earth/earth-night.jpg
          test -s _site/contributors-globe/assets/earth/earth-topology.png
          test -s _site/contributors-globe/assets/earth/night-sky.jpg
          test -s _site/3-sy/index.html
          test -n "$(ls _site/3-sy/assets/*.js 2>/dev/null)"

      - name: Upload consolidated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
