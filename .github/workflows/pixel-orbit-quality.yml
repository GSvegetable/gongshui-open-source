name: Pixel Orbit quality

on:
  push:
    branches: [main]
    paths:
      - "projects/pixel-orbit/**"
      - ".github/workflows/pixel-orbit-quality.yml"
  pull_request:
    paths:
      - "projects/pixel-orbit/**"
      - ".github/workflows/pixel-orbit-quality.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: Syntax and feature smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Pixel Orbit smoke checks
        working-directory: projects/pixel-orbit
        run: node tests/smoke.mjs
